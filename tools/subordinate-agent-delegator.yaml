name: "subordinate-agent-delegator"
description: "Spawns and supervises specialized sub-agents for multi-step task delegation."
input_schema:
  type: object
  properties:
    agent_role:
      type: string
      description: "Designated role or specialty of the subordinate agent."
    task_instructions:
      type: string
      description: "Detailed instruction prompt for the sub-agent."
    max_steps:
      type: integer
      description: "Maximum autonomous iterations allocated to the sub-agent."
      default: 10
  required:
    - agent_role
    - task_instructions
